# One server block is invalid (bad port); the other is fine. The server should
# log the bad one and keep serving the good one.
server {
    port notanumber;
    route / { methods GET; root www; }
}
server {
    host 127.0.0.1;
    port 8091;
    server_name good;
    route / { methods GET; root www; index index.html; }
}
