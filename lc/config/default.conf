# Example Localhost configuration.
# Comments start with '#'. Directives end with ';'. Blocks use '{ }'.

server {
    host        127.0.0.1;
    port        8080;
    server_name localhost;

    client_max_body_size 1m;

    error_page  404 errors/404.html;
    error_page  500 errors/500.html;

    route / {
        methods   GET;
        root      www;
        index     index.html;
        autoindex off;
    }

    route /uploads {
        methods   GET POST DELETE;
        root      www/uploads;
        autoindex on;
    }

    route /listing {
        methods   GET;
        root      www/listing;
        autoindex on;
    }

    route /cgi {
        methods   GET POST;
        root      www/cgi;
        cgi       .py /usr/bin/python3;
    }

    route /old {
        redirect  301 http://127.0.0.1:8080/;
    }
}

# A second virtual host sharing port 8080, distinguished by server_name.
server {
    host        127.0.0.1;
    port        8080;
    server_name example.com;

    route / {
        methods GET;
        root    www/example;
        index   index.html;
    }
}
